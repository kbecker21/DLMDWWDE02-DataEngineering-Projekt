services:
  # one-off setup steps, not part of the running stack:
  #   docker compose run --rm downloader
  #   docker compose run --rm preprocess
  downloader:
    build: ./downloader
    profiles: ["setup"]
    environment:
      OUT_DIR: /data/eea_e1a_2024
      EEA_MIRROR_URL: ${EEA_MIRROR_URL:-https://github.com/kbecker21/DLMDWWDE02-DataEngineering-Projekt/releases/download/data-v1/eea_e1a_2024.zip}
      DOWNLOAD_WORKERS: ${DOWNLOAD_WORKERS:-8}
    volumes:
      - ./data:/data

  preprocess:
    build: ./preprocess
    profiles: ["setup"]
    volumes:
      - ${DATA_DIR:-./data/eea_e1a_2024}:/input:ro
      - ./data/replay:/output

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # single node
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # topics are created by kafka-init, not on first use
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # partition count is fixed on purpose: changing it would remap station keys
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command:
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - ${KAFKA_TOPIC:-sensor-events}
      - --partitions
      - "12"
      - --replication-factor
      - "1"

  producer:
    build: ./producer
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-sensor-events}
      REPLAY_SPEED: ${REPLAY_SPEED:-1440}
      LATE_EVENT_RATE: ${LATE_EVENT_RATE:-0}
    volumes:
      - ./data/replay:/data:ro
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    # exits when the replay is through; only restart on errors
    restart: on-failure

  processor:
    build: ./processor
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-sensor-events}
      TRIGGER_SECONDS: ${TRIGGER_SECONDS:-10}
    volumes:
      - spark-checkpoints:/checkpoints
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 3g
    restart: unless-stopped

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka-data:
  spark-checkpoints:
