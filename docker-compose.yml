services:
  # one-off setup steps, not part of the running stack:
  #   docker compose run --rm downloader
  #   docker compose run --rm preprocess
  downloader:
    build: ./downloader
    profiles: ["setup"]
    environment:
      OUT_DIR: /data/eea_e1a_2024
      EEA_MIRROR_URL: ${EEA_MIRROR_URL:-https://github.com/kbecker21/DLMDWWDE02-DataEngineering-Projekt/releases/download/data-v1/eea_e1a_2024.zip}
      DOWNLOAD_WORKERS: ${DOWNLOAD_WORKERS:-8}
    volumes:
      - ./data:/data

  preprocess:
    build: ./preprocess
    profiles: ["setup"]
    volumes:
      - ${DATA_DIR:-./data/eea_e1a_2024}:/input:ro
      - ./data/replay:/output

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # single node
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # topics are created by kafka-init, not on first use
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped

  # changing the partition count would remap station keys
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command:
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - ${KAFKA_TOPIC:-sensor-events}
      - --partitions
      - "12"
      - --replication-factor
      - "1"

  producer:
    build: ./producer
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-sensor-events}
      REPLAY_SPEED: ${REPLAY_SPEED:-1440}
      LATE_EVENT_RATE: ${LATE_EVENT_RATE:-0}
    volumes:
      - ./data/replay:/data:ro
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    # one-shot: exits when the replay is through (see README)
    restart: "no"
    init: true

  timescaledb:
    image: timescale/timescaledb:2.29.0-pg17
    environment:
      POSTGRES_DB: ${DB_NAME:-airquality}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?set in .env}
      # used by db/02_roles.sh on first start
      SPARK_DB_PASSWORD: ${SPARK_DB_PASSWORD:?set in .env}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - tsdb-data:/var/lib/postgresql/data
      # mounted one by one so the image's own init script stays visible
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/02_roles.sh:/docker-entrypoint-initdb.d/02_roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d ${DB_NAME:-airquality}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  processor:
    build: ./processor
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-sensor-events}
      TRIGGER_SECONDS: ${TRIGGER_SECONDS:-10}
      DB_HOST: timescaledb
      DB_NAME: ${DB_NAME:-airquality}
      DB_USER: spark
      DB_PASSWORD: ${SPARK_DB_PASSWORD:?set in .env}
    volumes:
      - spark-checkpoints:/checkpoints
    # Spark UI answers once the job is up
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4040/api/v1/applications"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 3g
    restart: unless-stopped

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/air-quality.json
      # read by the provisioned datasource
      DB_NAME: ${DB_NAME:-airquality}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      timescaledb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  # unit tests need no stack, the e2e test the running one: docker compose run --rm tests
  tests:
    build: ./tests
    profiles: ["test"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-sensor-events}
      DB_HOST: timescaledb
      DB_NAME: ${DB_NAME:-airquality}
      DB_USER: grafana
      DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set in .env}
      GRAFANA_URL: http://grafana:3000
    volumes:
      - .:/app:ro

volumes:
  kafka-data:
  spark-checkpoints:
  tsdb-data:
